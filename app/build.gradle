plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abtal.subway'
    compileSdk 35

    defaultConfig {
        applicationId "com.abtal.subway"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly on any phone.
            // For Google Play, create your own key: Build > Generate Signed App Bundle.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
