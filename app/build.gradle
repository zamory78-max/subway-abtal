plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abtal.subway'
    compileSdk 35

    defaultConfig {
        applicationId "com.abtal.subway"
        minSdk 24
        targetSdk 35
        // Every cloud build gets a higher versionCode so it installs as an update
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // Permanent signing key (from GitHub secrets) so each new APK installs over the previous one.
    // Without the secrets (e.g. a local build) the debug key is used instead.
    def ksPath = System.getenv("ABTAL_KEYSTORE")
    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("ABTAL_KEYSTORE_PASSWORD")
                keyAlias "abtal"
                keyPassword System.getenv("ABTAL_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    // Two versions from the same game: "phone" (portrait, touch) and "tv" (landscape, remote control)
    flavorDimensions "device"
    productFlavors {
        phone {
            dimension "device"
        }
        tv {
            dimension "device"
            applicationIdSuffix ".tv"
            versionNameSuffix "-tv"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
