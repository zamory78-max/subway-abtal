name: Libraries snapshot (dev)

# Manual helper: downloads the game libraries and stores them on the "dev-libs" branch
# so the game can be previewed/tested without internet access to the CDNs.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/download-libs.sh
      - name: Push libraries to dev-libs branch
        run: |
          mkdir /tmp/out && cp -r app/src/main/assets/www/lib /tmp/out/lib
          cd /tmp/out
          git init -q -b dev-libs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Game libraries snapshot"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dev-libs
